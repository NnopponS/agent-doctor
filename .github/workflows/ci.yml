name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Self-audit agent-doctor MCP 2026 server with --ci gate
        run: node dist/cli.js check "node dist/cli.js mcp" --ci
      - name: Self-audit 4-layer AAIF stack with --ci gate
        run: node dist/cli.js stack . --ci
