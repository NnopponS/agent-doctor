name: 'Agent Doctor — 2026 AAIF Stack Linter, Prompt-Cache Profiler & Schema Healer'
description: 'Audit AGENTS.md, SKILL.md, MCP 2026 servers, and A2A Agent Cards for prompt-cache busting, token bloat, JSON Schema bugs, and security risks.'
author: 'Worapon Sangsasri (NnopponS)'
branding:
  icon: 'activity'
  color: 'blue'
inputs:
  stack-dir:
    description: 'Audit a workspace directory across all 4 AAIF layers (AGENTS.md, SKILL.md, MCP 2026, A2A)'
    required: false
  command:
    description: 'Stdio command to launch and inspect a live MCP server (e.g., "node dist/index.js")'
    required: false
  schema-file:
    description: 'Path to a static tools/list JSON schema file to audit'
    required: false
  sarif-output:
    description: 'Optional file path to write OASIS SARIF 2.1.0 output'
    required: false
  fail-on-issues:
    description: 'Fail the workflow step if errors are detected or score < 70'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Build agent-doctor
      shell: bash
      env:
        DOCTOR_ACTION_DIR: ${{ github.action_path }}
      run: |
        cd "$DOCTOR_ACTION_DIR"
        npm ci
        npm run build
    - name: Run Agent Doctor Audit
      shell: bash
      env:
        DOCTOR_ACTION_DIR: ${{ github.action_path }}
        DOCTOR_FAIL_ON_ISSUES: ${{ inputs.fail-on-issues }}
        DOCTOR_STACK: ${{ inputs.stack-dir }}
        DOCTOR_COMMAND: ${{ inputs.command }}
        DOCTOR_SCHEMA: ${{ inputs.schema-file }}
        DOCTOR_SARIF: ${{ inputs.sarif-output }}
      run: |
        CI_FLAG=""
        if [ "$DOCTOR_FAIL_ON_ISSUES" = "true" ]; then
          CI_FLAG="--ci"
        fi
        if [ -n "$DOCTOR_STACK" ]; then
          node "$DOCTOR_ACTION_DIR/dist/cli.js" stack "$DOCTOR_STACK" $CI_FLAG
        elif [ -n "$DOCTOR_COMMAND" ]; then
          node "$DOCTOR_ACTION_DIR/dist/cli.js" check "$DOCTOR_COMMAND" $CI_FLAG
          if [ -n "$DOCTOR_SARIF" ]; then
            node "$DOCTOR_ACTION_DIR/dist/cli.js" check "$DOCTOR_COMMAND" --sarif > "$DOCTOR_SARIF"
          fi
        elif [ -n "$DOCTOR_SCHEMA" ]; then
          node "$DOCTOR_ACTION_DIR/dist/cli.js" analyze "$DOCTOR_SCHEMA" $CI_FLAG
          if [ -n "$DOCTOR_SARIF" ]; then
            node "$DOCTOR_ACTION_DIR/dist/cli.js" analyze "$DOCTOR_SCHEMA" --sarif > "$DOCTOR_SARIF"
          fi
        else
          node "$DOCTOR_ACTION_DIR/dist/cli.js" stack . $CI_FLAG
        fi
